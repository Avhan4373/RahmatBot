# nginx-lisensi.conf — reverse proxy server lisensi RahmatBot (TAHAP AWAL: HTTP saja).
# Pasang di VPS:
#   sudo cp deploy/nginx-lisensi.conf /etc/nginx/sites-available/lisensi
#   sudo ln -s /etc/nginx/sites-available/lisensi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lisensi.avhanapp.my.id
#
# certbot akan MENAMBAH sendiri blok 443 (SSL) + redirect HTTP->HTTPS,
# lalu menulis ulang file ini. Jadi jangan tulis blok ssl_* manual di sini.
#
# Hanya meneruskan ke backend loopback. X-Forwarded-For DITIMPA dengan
# $remote_addr (bukan append) agar rate-limit backend tak bisa di-spoof.
server {
    listen 80;
    listen [::]:80;
    server_name lisensi.avhanapp.my.id;

    # Body request lisensi kecil (JSON < 1KB). Batasi ketat.
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
